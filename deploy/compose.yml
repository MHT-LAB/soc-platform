# One compose file for dev and prod. Stage-specific edges (tunnel now, reverse
# proxy on a VPS later) are added with an override file, so moving hosts is
# a data copy plus swapping one service.
name: soc

services:
  api:
    image: ${SOC_API_IMAGE:-soc-api:dev}
    build:
      context: ../api
      args:
        VERSION: dev
    restart: unless-stopped
    environment:
      SOC_ENV: ${SOC_ENV:-prod}
    # The public app: /healthz, /version and /ingest/<source>. It carries no
    # console code and gets no console or EDR secrets; its only secrets are
    # ingest.env (per-source webhook secrets and the soc_ingest database URL,
    # mode 600). Bound to loopback only; the public tunnel is how the internet
    # reaches it. Without ingest.env every /ingest/ path is a 404.
    env_file:
      - path: ${SOC_STATE_DIR:-/srv/soc}/env/ingest.env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    # default: the tunnel reaches this app there. db: the only route to the
    # database. No depends_on db on purpose: a database outage must answer
    # deliveries with 503, not stop /healthz or roll back a deploy.
    networks:
      - default
      - db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # The operations console: the same image, a different app, and a different
  # network. Publishing a port on 127.0.0.1 would not keep the tunnel out
  # (containers on the compose network reach each other directly), so this
  # service joins the HOST network instead and listens on the host's loopback.
  # Containers cannot connect to the host's loopback, so the tunnel cannot
  # reach it; `tailscale serve` on the host is the only way in.
  # Trade-off: the container sees the host's network (LAN and loopback
  # services). It stays non-root, read-only and capability-free to limit that.
  console:
    image: ${SOC_API_IMAGE:-soc-api:dev}
    restart: unless-stopped
    network_mode: host
    command:
      - uvicorn
      - soc_api.console_main:app
      - --host
      - 127.0.0.1
      - --port
      - "8081"
      - --no-server-header
    environment:
      SOC_ENV: ${SOC_ENV:-prod}
      # The digest-pinned reference deploy.sh verified, shown on the console.
      SOC_IMAGE_REF: ${SOC_API_IMAGE:-}
      # cloudflared readiness, published on the host's loopback by the edge overlay.
      SOC_TUNNEL_READY_URL: ${SOC_TUNNEL_READY_URL:-http://127.0.0.1:2000/ready}
    # Secrets written by the operator on the host (mode 600): the console
    # allowlist (required) and the optional read-only EDR key.
    env_file:
      - path: ${SOC_STATE_DIR:-/srv/soc}/env/lc.env
        required: false
      - path: ${SOC_STATE_DIR:-/srv/soc}/env/console.env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # PostgreSQL 16 (ADR 0001). Only with the `db` profile, which deploy.sh turns on
  # when db.env and db-owner.env exist, so hosts without them deploy as before.
  # On an internal network shared only with api and migrate: the tunnel is not on
  # it, nothing is published on the host, and the console (host network) does not
  # use the database yet. The data directory is under /srv/soc so the container's
  # nightly backup includes it. The postgres superuser is refused over TCP
  # (initdb/20-hba.sh) and works only on the container's own socket.
  db:
    profiles: [db]
    image: postgres:16.15-trixie@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    user: "999:999"
    networks:
      - db
    # POSTGRES_PASSWORD (superuser, first start only) and SOC_DB_OWNER_PASSWORD.
    env_file:
      - path: ${SOC_STATE_DIR:-/srv/soc}/env/db.env
        required: true
    volumes:
      - ${SOC_STATE_DIR:-/srv/soc}/pgdata:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    stop_grace_period: 30s
    # Over TCP on purpose: the temporary server that runs the init scripts on
    # first start listens on the socket only, and must not count as healthy.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "soc_owner", "-d", "soc"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # The pager worker: alerts -> cases -> phone pushes, plus the weekly OK and STALE
  # pushes. Its own profile: deploy.sh turns it on only when env/worker.env exists
  # (deploy/init-worker.sh creates it), so a host without one deploys as before.
  # On the database network and on `egress` (outbound to the push server) and NOT on
  # `default`, the tunnel's network. (It shares the internal db network with the public
  # app, as both are database clients; the app is not on `egress`.) Nothing listens and
  # nothing is published. The database being down must not fail a deploy,
  # so there is no depends_on; the loop retries. Healthy = it completed a pass in the
  # last minute.
  worker:
    profiles: [worker]
    image: ${SOC_API_IMAGE:-soc-api:dev}
    restart: unless-stopped
    command: ["python", "-m", "soc_api.worker"]
    environment:
      SOC_ENV: ${SOC_ENV:-prod}
    env_file:
      - path: ${SOC_STATE_DIR:-/srv/soc}/env/worker.env
        required: true
      # Optional, not secret: SOC_PAGE_POLICY={"<category>": <priority 0-5>, ...}
      - path: ${SOC_STATE_DIR:-/srv/soc}/env/policy.env
        required: false
    networks:
      - db
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-health') < 60 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s

  # One-off: `docker compose run --rm migrate` applies the schema and gives
  # soc_ingest its login (python -m soc_api.db deploy), as the owner role. Needs
  # db-owner.env (SOC_MIGRATE_URL, SOC_INGEST_DB_PASSWORD). To seed a tenant:
  # `run --rm --entrypoint python migrate -m soc_api.seed /seed/<file>.json`.
  # Its own profile so `up -d` never starts it; only `run` does.
  migrate:
    profiles: [migrate]
    image: ${SOC_API_IMAGE:-soc-api:dev}
    restart: "no"
    networks:
      - db
    entrypoint: ["python", "-m", "soc_api.db"]
    command: ["deploy"]
    env_file:
      - path: ${SOC_STATE_DIR:-/srv/soc}/env/db-owner.env
        required: true
      # SOC_WORKER_DB_PASSWORD (init-worker.sh): gives soc_worker its login.
      - path: ${SOC_STATE_DIR:-/srv/soc}/env/worker-owner.env
        required: false
    volumes:
      - ${SOC_STATE_DIR:-/srv/soc}/seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m

networks:
  # No route out and none in from the default network.
  db:
    internal: true
  # Outbound only, for the worker's pushes. Only the worker is on it.
  egress: {}
