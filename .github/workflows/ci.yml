# Every pull request and push to main runs the full gate set. A red job blocks
# the merge. Third-party actions are pinned to full commit SHAs (tag in the
# trailing comment) so a moved tag can't change what runs; Dependabot bumps them.
name: ci

on:
  pull_request:
    # "edited" re-runs the gate when a PR title or body changes: on squash merge
    # they become the commit message on main, so they must be scanned too.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.12"
  SEMGREP_VERSION: "1.181.0"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  test:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    # Throwaway database for the schema tests (RLS, ingest role). Pinned by digest
    # like every other image; the password is a CI-only value for a container that
    # lives for this job.
    services:
      postgres:
        image: postgres:16.15-trixie@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOC_TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
      # Missing database config fails the job instead of skipping the schema tests.
      SOC_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -W error

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Official release binary, checksum-verified. Needs no API token.
      - name: install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: scan full history
        run: /tmp/gitleaks git --redact --verbose --exit-code 1 .

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: semgrep
        run: >-
          uvx --python 3.12 semgrep==${{ env.SEMGREP_VERSION }} scan
          --config p/python --config p/security-audit --config p/secrets
          --config p/dockerfile --config p/github-actions
          --metrics=off --error

  dependencies:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: audit locked dependencies against known vulnerabilities
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx --python 3.12 pip-audit==${{ env.PIP_AUDIT_VERSION }} --strict --disable-pip --require-hashes -r /tmp/requirements.txt

  iac:
    name: Dockerfile + config lint (hadolint, checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: api/Dockerfile
      - uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: .
          framework: dockerfile github_actions
          quiet: true

  image:
    name: build + scan image (trivy)
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          load: true
          tags: soc-api:ci
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soc-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: smoke test the built image
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL -e SOC_CONSOLE_USERS=ci@example.com -p 127.0.0.1:8080:8080 soc-api:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs smoke; exit 1
      - name: console isolation (compose services, tunnel-side probe)
        run: |
          # The smoke container holds 127.0.0.1:8080, which compose's api needs.
          docker rm -f smoke > /dev/null
          scripts/test-console-isolation.sh soc-api:ci
      - name: public app starts in prod without a console allowlist
        run: |
          docker run -d --name pubnoallow --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:8090:8080 soc-api:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8090/healthz && exit 0; sleep 1; done
          docker logs pubnoallow; exit 1
      - name: console image refuses to start in prod without a console allowlist
        run: |
          # No SOC_CONSOLE_USERS: the container must exit with an error (not run, not time out).
          rc=0
          timeout 30 docker run --name noallow --read-only --tmpfs /tmp --cap-drop ALL --entrypoint uvicorn soc-api:ci soc_api.console_main:app --port 8081 > noallow.log 2>&1 || rc=$?
          docker rm -f noallow > /dev/null 2>&1 || true
          cat noallow.log
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then echo "image started without a console allowlist (rc=$rc)"; exit 1; fi
          grep -q SOC_CONSOLE_USERS noallow.log

  scrub:
    name: scrub gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On PRs, check the branch's real commits, not the temporary merge
          # commit GitHub synthesizes for testing.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: scrub gate self-test
        run: scripts/test-scrub-check.sh
      - run: scripts/scrub-check.sh
        # Values go in through env, never inline in the script: PR text is
        # attacker-controlled and must not be parsed as shell.
        env:
          SCRUB_DENYLIST: ${{ secrets.SCRUB_DENYLIST }}
          SCRUB_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCRUB_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '1' || '' }}
          SCRUB_PR: ${{ github.event_name == 'pull_request' && '1' || '' }}
          SCRUB_PR_TITLE: ${{ github.event.pull_request.title }}
          SCRUB_PR_BODY: ${{ github.event.pull_request.body }}
