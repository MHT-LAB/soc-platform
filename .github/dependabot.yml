version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    # The Python line is a deliberate decision (ADR 0003, requires-python);
    # take digest and patch refreshes only, move minor versions by hand.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
