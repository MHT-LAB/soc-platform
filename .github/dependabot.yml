version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    # The Python line is a deliberate decision (ADR 0003, requires-python);
    # take digest and patch refreshes only, move minor versions by hand.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The digest-pinned images in the compose files (postgres, restic, cloudflared). The
  # docker-compose ecosystem reads compose*.yml; if this ecosystem is ever unavailable,
  # the docker one with the same directory is the fallback.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
    # A Postgres major upgrade needs a dump and restore, so it moves by hand; digest and
    # minor/patch refreshes only.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
